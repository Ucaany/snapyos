[package]
name = "snapyos-kiosk"
version = "0.1.0"
description = "SNAPY OS kiosk: satu jendela fullscreen ke halaman kiosk cloud"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# `tauri::generate_context!` memerlukan serde_json di crate root.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
