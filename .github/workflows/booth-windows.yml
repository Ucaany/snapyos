name: Booth Windows

# Build + test aplikasi booth di runner Windows, lalu:
#   - push/PR        → artefak build (14 hari)
#   - tag v*         → GitHub Release berisi ZIP siap pakai (tanpa .NET SDK di mesin operator)
#
# MSIX + code signing ditambahkan pada fase 5 (booth/plan.md).

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths:
      - "booth/**"
      - ".github/workflows/booth-windows.yml"
  pull_request:
    paths:
      - "booth/**"
      - ".github/workflows/booth-windows.yml"
  workflow_dispatch:
    # Rilis manual: tag yang dipakai untuk ZIP. Prerelease hanya bila diminta,
    # sehingga rilis manual tidak selamanya berlabel prerelease.
    inputs:
      release_tag:
        description: "Tag rilis (kosong = tidak menerbitkan Release)"
        required: false
        type: string
      prerelease:
        description: "Tandai Release sebagai prerelease"
        required: false
        type: boolean
        default: false

concurrency:
  group: booth-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Satu sumber kebenaran untuk "ini rilis?". Tag push = selalu rilis;
      # workflow_dispatch hanya bila release_tag diisi.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
    defaults:
      run:
        shell: pwsh
        working-directory: booth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: booth/**/*.csproj

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booth/ui/package-lock.json

      - name: Versi toolchain
        run: |
          "dotnet SDK : " + (dotnet --version)
          "node       : " + (node --version)
          "npm        : " + (npm --version)
          $edge = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $wv2 = if (Test-Path $edge) { (Get-ItemProperty $edge).pv } else { "tidak terdeteksi" }
          "WebView2   : $wv2"

      - name: Regenerasi kontrak setelan
        working-directory: .
        run: node booth/contracts/generate.mjs

      - name: Kontrak tidak basi
        working-directory: .
        run: git diff --exit-code src/lib/generated/device-settings.gen.ts booth/src/SnapyOS.Booth.Contracts/DeviceSettings.g.cs

      - name: Build UI React
        working-directory: booth/ui
        run: |
          npm ci
          npm run build

      - name: Build solusi
        run: dotnet build SnapyOS.Booth.sln -c Debug -p:SkipUiBuild=true

      - name: Tes xUnit
        run: dotnet test tests/SnapyOS.Booth.Tests/SnapyOS.Booth.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/SnapyOS.Booth.Shell/SnapyOS.Booth.Shell.csproj -c Release -r win-x64 --self-contained true -p:SkipUiBuild=true -o dist/booth

      - name: Verifikasi keluaran
        run: |
          $exe = "dist/booth/SnapyOS.Booth.Shell.exe"
          $ui = "dist/booth/Assets/ui/index.html"
          if (-not (Test-Path $exe)) { throw "EXE tidak ada: $exe" }
          if (-not (Test-Path $ui)) { throw "UI tidak ikut publish: $ui" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $count = (Get-ChildItem dist/booth -Recurse -File).Count
          $lines = @(
            "versi: ${{ github.sha }}",
            "exe sha256: $hash",
            "berkas di dist/booth: $count"
          )
          $lines | Tee-Object -FilePath dist/booth/SHA256SUMS.txt
          $lines | ForEach-Object { $_ }

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: snapyos-booth-win-x64-${{ github.sha }}
          path: booth/dist/booth
          if-no-files-found: error
          retention-days: 14

      - name: Kemas ZIP rilis
        if: env.RELEASE_TAG != ''
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "dist/snapyos-booth-$tag-win-x64.zip"
          Compress-Archive -Path dist/booth/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  snapyos-booth-$tag-win-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          "ZIP: $zip"
          "SHA-256: $hash"

      - name: Terbitkan GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            booth/dist/snapyos-booth-${{ env.RELEASE_TAG }}-win-x64.zip
            booth/dist/snapyos-booth-${{ env.RELEASE_TAG }}-win-x64.zip.sha256
          body: |
            Rilis aplikasi booth SNAPY OS ${{ env.RELEASE_TAG }} (Windows x64).

            ## Cara pakai (tanpa .NET SDK)

            1. Unduh `snapyos-booth-${{ env.RELEASE_TAG }}-win-x64.zip`.
            2. Ekstrak ke folder permanen, mis. `C:\SNAPYOS\booth`.
            3. Jalankan `Jalankan-Booth.cmd`.

            Tidak perlu memasang .NET 8 SDK — runtime sudah dibundel (self-contained).

            ## Prasyarat mesin

            - Windows 10 1809+ / Windows 11, x64.
            - WebView2 Runtime. Sudah ada di Windows 11 dan Windows 10 yang
              terbarui. Bila aplikasi menolak start, pasang "Evergreen Runtime"
              dari Microsoft.

            ## Mode uji (mock)

            `Jalankan-Booth.cmd` memakai adapter mock bila dipanggil dengan `-Mock`.
            Mock **wajib** `SNAPYOS_ALLOW_MOCK=1` dan dilabeli di UI; jangan dipakai
            untuk melayani pelanggan.

            ## Verifikasi unduhan

            Cocokkan SHA-256 ZIP dengan berkas `.sha256` di rilis ini:

            ```powershell
            Get-FileHash .\snapyos-booth-${{ env.RELEASE_TAG }}-win-x64.zip -Algorithm SHA256
            ```
          prerelease: ${{ env.PRERELEASE == 'true' }}
          fail_on_unmatched_files: true

      - name: Catat hasil verifikasi
        if: always()
        run: |
          @(
            "CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit: ${{ github.sha }}",
            "runner: windows-latest",
            "status: ${{ job.status }}"
          ) | Write-Output
