name: Booth Windows

# Build + test aplikasi booth Windows (WPF) di runner Windows milik GitHub
# (cloud, bukan mesin lokal).
#
# STATUS: FROZEN untuk pengembangan fitur — Windows native ditahan, target
# aktif = PWA kiosk Android/web. Workflow TETAP AKTIF dan berjalan otomatis
# setiap ada perubahan di `windows/**`, supaya kode yang dibekukan tidak
# diam-diam rusak. Jalankan juga manual lewat "Run workflow", atau otomatis
# saat tag `v*` dibuat (menghasilkan GitHub Release).
#
# Struktur nyata yang dibangun:
#   - solusi   : windows/SnapyOS.sln (15 project, target net10.0-windows)
#   - paket    : windows/deploy/Package-SnapyOS-Kiosk.ps1
#   - gate     : windows/deploy/Test-SnapyOS-Readiness.ps1
#   - keluaran : windows/SnapyOS-Kiosk-win-x64-v<versi>.zip
#
# Catatan: workflow lama menunjuk folder `booth/` dan project `SnapyOS.Booth.*`
# yang tidak pernah ada di repo ini, sehingga selalu gagal bila dijalankan.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (mis. 0.1.6). Kosong = 0.0.0-dev"
        required: false
        default: "0.0.0-dev"
      self_contained:
        description: "Bundle .NET runtime (wajib untuk mesin tanpa .NET 10)"
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "windows/**"
      - ".github/workflows/booth-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/booth-windows.yml"

concurrency:
  group: booth-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: windows/**/*.csproj

      - name: Versi toolchain
        run: |
          "dotnet SDK : " + (dotnet --version)
          "runner OS  : " + $env:RUNNER_OS

      # Skrip paket melakukan restore → build Release → dotnet test sendiri,
      # jadi tidak ada langkah restore/build terpisah di sini (hindari dobel).
      - name: Tentukan versi
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.0.0-dev" }
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Versi: $v"

      # Satu build saja: skrip gate memanggil Package-SnapyOS-Kiosk.ps1
      # (restore → build Release → dotnet test → publish → manifest → ZIP),
      # lalu memverifikasi isi manifest, checksum, dan rencana installer.
      - name: Paket + gate kesiapan
        shell: pwsh
        run: |
          # $args adalah automatic variable PowerShell — jangan dipakai sebagai nama.
          $sc = "${{ github.event.inputs.self_contained }}"
          $gateArgs = @("-Version", "${{ steps.ver.outputs.version }}")
          if ($sc -ne "false") { $gateArgs += "-SelfContained" }
          & .\windows\deploy\Test-SnapyOS-Readiness.ps1 @gateArgs

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: snapyos-kiosk-win-x64-${{ steps.ver.outputs.version }}
          path: windows/SnapyOS-Kiosk-win-x64-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Terbitkan GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: windows/SnapyOS-Kiosk-win-x64-v${{ steps.ver.outputs.version }}.zip
          body: |
            Rilis aplikasi booth SNAPY OS ${{ github.ref_name }} (Windows x64).

            ## Cara pakai (tanpa .NET SDK)

            1. Unduh `SnapyOS-Kiosk-win-x64-v${{ steps.ver.outputs.version }}.zip`.
            2. Ekstrak ke folder permanen, mis. `C:\SNAPYOS\kiosk`.
            3. Jalankan `Install-SnapyOS-Kiosk.ps1 -Action Detect` lebih dulu,
               lalu `-Action Install` di PowerShell elevated.

            ## Prasyarat mesin

            - Windows 10 1809+ / Windows 11, x64.
            - WebView2 Runtime (sudah ada di Windows 11 dan Windows 10 terbarui).

            ## Verifikasi unduhan

            Cocokkan SHA-256 ZIP dengan baris `SHA256:` yang dicetak skrip paket:

            ```powershell
            Get-FileHash .\SnapyOS-Kiosk-win-x64-v${{ steps.ver.outputs.version }}.zip -Algorithm SHA256
            ```
          fail_on_unmatched_files: true

      - name: Catat hasil
        if: always()
        run: |
          @(
            "CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit: ${{ github.sha }}",
            "runner: windows-latest",
            "status: ${{ job.status }}"
          ) | Write-Output
