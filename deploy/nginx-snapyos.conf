# SnapyOS: reverse proxy Nginx (HTTP).
#
# Pasang:
#   sudo cp deploy/nginx-snapyos.conf /etc/nginx/sites-available/snapyos
#   sudo ln -s /etc/nginx/sites-available/snapyos /etc/nginx/sites-enabled/snapyos
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: tambahkan blok listen 443 + sertifikat (certbot) di server block yang
# sama. Header keamanan (CSP, HSTS, X-Frame-Options) sudah dikeluarkan Next
# lewat next.config.ts; jangan diduplikasi di sini.

upstream snapyos_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.snapyos.biz.id;

    server_tokens off;

    # Batas upload. Catatan: aplikasi menerima finalize sampai 50 MB; dengan
    # nilai 25M request 25-50 MB ditolak Nginx sebelum sampai ke app.
    client_max_body_size 25M;
    client_body_timeout 120s;

    # --- Header proxy ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Upload kiosk dibaca backend sekali; jangan buffer ke disk Nginx.
    proxy_request_buffering off;
    proxy_buffering off;

    # --- Aset statis ber-hash: cache 1 tahun, immutable ---
    # Header Cache-Control dari Next disembunyikan agar hanya ada satu nilai.
    location /_next/static/ {
        proxy_pass http://snapyos_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Blokir dotfiles dan .git ---
    location ~ /\.git {
        deny all;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # Health check: jangan dicatat dan jangan di-cache.
    location = /api/health {
        access_log off;
        add_header Cache-Control "no-store" always;
        proxy_pass http://snapyos_app;
    }

    location / {
        proxy_pass http://snapyos_app;
    }
}

# WebSocket upgrade map. File ini di-include di dalam konteks http, jadi `map`
# di sini tetap sah.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
